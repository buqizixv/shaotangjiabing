<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 更好方案</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;background:#272729;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#FFF;box-shadow:0 25px 60px rgba(0,0,0,0.12),inset 0 0 0 0.5px rgba(255,255,255,0.06)}
.card-body{flex:1;padding:32px 28px 0;display:flex;flex-direction:column}
.card-footer{padding:16px 28px 28px;display:flex;justify-content:space-between;align-items:flex-end}
.scene-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);letter-spacing:0.3px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.primary-value{font-size:30px;font-weight:700;letter-spacing:-0.5px;line-height:1.15;margin-bottom:6px}
.primary-sub{font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:4px}
.divider{height:1px;background:rgba(255,255,255,0.08);margin:16px 0}
.better-panel{background:rgba(41,151,255,0.06);border-left:3px solid #2997FF;border-radius:0 16px 16px 0;padding:16px 18px;margin:4px 0}
.better-title{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.better-title svg{color:#2997FF}
.better-route{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:6px}
.better-saving{font-size:15px;color:#2997FF;font-weight:600;margin-bottom:14px}
.better-actions{display:flex;gap:10px}
.btn-outline{background:transparent;color:#2997FF;border:1px solid rgba(41,151,255,0.25);border-radius:14px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-fill{background:#2997FF;color:#fff;border:none;border-radius:14px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.better-dismiss{font-size:12px;color:rgba(255,255,255,0.2);margin-top:10px}
.data-source{font-size:11px;color:rgba(255,255,255,0.2);margin-top:auto;padding-top:12px}
.user-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.correction{font-size:13px;color:rgba(255,255,255,0.25);cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<a href="index.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-body">
    <div class="scene-label">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 8.5l5-6 5 6M4.5 7.5v5.5h2.5v-3h2v3h2.5v-5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      准备出门
    </div>
    <div class="primary-value">预计 42 分钟到达</div>
    <div class="primary-sub">步行 → 15号线（顺义方向）→ 步行</div>

    <div class="divider"></div>

    <div class="better-panel">
      <div class="better-title">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5a4.5 4.5 0 00-2 8.54V12a1 1 0 001 1h2a1 1 0 001-1v-1.96A4.5 4.5 0 008 1.5z" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 14.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        发现更快方案
      </div>
      <div class="better-route">方案三：步行 → 公交477路 → 步行</div>
      <div class="better-saving">预计 35 分钟，比当前快约 7 分钟</div>
      <div class="better-actions">
        <button class="btn-outline" onclick="window.location.href='03-select-plan.html'">查看详情</button>
        <button class="btn-fill" onclick="window.location.href='05-ready.html'">采用方案</button>
      </div>
      <div class="better-dismiss">放弃后本次不再提示</div>
    </div>

    <div class="data-source">路线数据 · 高德 · 1 分钟前更新</div>
  </div>
  <div class="card-footer">
    <button class="user-btn" onclick="window.location.href='16-settings.html'" title="设置与历史">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <a class="correction" href="#">纠正当前状态</a>
  </div>
</div>
</body>
</html>
