<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 无行程</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;background:#FFFFFF;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#1D1D1F;box-shadow:0 25px 60px rgba(0,0,0,0.06),inset 0 0 0 0.5px rgba(0,0,0,0.04)}
.card-body{flex:1;padding:32px 28px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.card-footer{padding:16px 28px 28px;display:flex;justify-content:space-between;align-items:flex-end}
.idle-icon{width:56px;height:56px;border-radius:50%;background:#F5F5F7;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.idle-title{font-size:20px;font-weight:600;margin-bottom:8px;color:#1D1D1F}
.idle-desc{font-size:14px;color:#86868B;line-height:1.6;margin-bottom:32px;max-width:260px}
.divider{height:1px;background:#E5E5EA;width:100%;margin:0 0 20px}
.quick-links{width:100%;text-align:left}
.quick-link{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:15px;color:#0066CC;text-decoration:none;border-bottom:1px solid #F2F2F7}
.quick-link:last-child{border-bottom:none}
.quick-link svg{color:#0066CC;flex-shrink:0}
.last-trip{font-size:12px;color:#C7C7CC;text-align:center;padding-top:20px}
.user-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.04);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.user-btn:hover{background:rgba(0,0,0,0.07)}
</style>
</head>
<body>
<a href="原型导航.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-body">
    <div class="idle-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#C7C7CC" stroke-width="1.5"/><path d="M8 15c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="10" r="1" fill="#C7C7CC"/><circle cx="15" cy="10" r="1" fill="#C7C7CC"/></svg>
    </div>
    <div class="idle-title">当前没有通勤记录中</div>
    <div class="idle-desc">系统将在你离开常用起点时自动开始记录</div>

    <div class="divider"></div>

    <div class="quick-links">
      <a href="03-选择方案.html" class="quick-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="2.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="7" width="8" height="2.5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="11" width="10" height="2.5" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
        查看保存的通勤方案
      </a>
      <a href="17-历史.html" class="quick-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="9" width="3" height="5" rx="0.5" fill="currentColor" opacity="0.3"/><rect x="6.5" y="5" width="3" height="9" rx="0.5" fill="currentColor" opacity="0.5"/><rect x="11" y="2" width="3" height="12" rx="0.5" fill="currentColor" opacity="0.7"/></svg>
        查看通勤历史
      </a>
      <a href="#" class="quick-link">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 7l4-4 4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        补记一次通勤
      </a>
    </div>
    <div class="last-trip">上次通勤：今天 08:05 到达 · 47 分钟</div>
  </div>
  <div class="card-footer">
    <button class="user-btn" onclick="window.location.href='16-设置.html'" title="设置与历史">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" fill="none"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <span style="font-size:11px;color:#C7C7CC">在途 Onway</span>
  </div>
</div>
</body>
</html>
