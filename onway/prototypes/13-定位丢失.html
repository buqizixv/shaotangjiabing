<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 定位丢失</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;background:#272729;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#FFF;box-shadow:0 25px 60px rgba(0,0,0,0.12),inset 0 0 0 0.5px rgba(255,255,255,0.06)}
.card-body{flex:1;padding:32px 28px 0;display:flex;flex-direction:column;overflow-y:auto}
.card-body::-webkit-scrollbar{display:none}
.card-footer{padding:16px 28px 28px;display:flex;justify-content:space-between;align-items:flex-end}
.scene-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);letter-spacing:0.3px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.line-info{font-size:16px;color:#2997FF;font-weight:600;margin-bottom:16px}
.warning-banner{background:rgba(255,159,10,0.08);border-left:3px solid #FF9F0A;border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:16px}
.warning-title{font-size:14px;color:#FF9F0A;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.warning-desc{font-size:13px;color:rgba(255,255,255,0.4);line-height:1.5}
.warning-time{font-size:12px;color:rgba(255,255,255,0.25);margin-top:6px}
.timeline{position:relative;padding-left:24px;margin-bottom:8px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,0.06)}
.t-item{position:relative;padding:6px 0;font-size:14px;color:rgba(255,255,255,0.2)}
.t-dot{position:absolute;left:-24px;top:10px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.1)}
.t-confirmed{color:#2997FF}
.t-confirmed .t-dot{background:#2997FF}
.t-confirmed-label{font-size:11px;color:rgba(255,255,255,0.25);margin-left:6px}
.t-unknown .t-dot{background:rgba(255,159,10,0.4);border:1px dashed rgba(255,159,10,0.5)}
.t-unknown{color:rgba(255,255,255,0.25);font-style:italic}
.divider{height:1px;background:rgba(255,255,255,0.08);margin:14px 0}
.frozen-text{font-size:14px;color:rgba(255,255,255,0.35);margin-bottom:8px}
.info-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}
.info-label{color:rgba(255,255,255,0.4);font-size:13px}
.info-value{color:rgba(255,255,255,0.5);font-size:14px}
.data-source{font-size:11px;color:rgba(255,255,255,0.2);margin-top:auto;padding-top:12px}
.user-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.footer-actions{display:flex;gap:8px}
.pill-btn{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);border:none;border-radius:14px;padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.pill-btn:hover{background:rgba(255,255,255,0.1)}
</style>
</head>
<body>
<a href="原型导航.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-body">
    <div class="scene-label">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="1.5" width="9" height="10" rx="2" stroke="currentColor" stroke-width="1.1"/><line x1="3.5" y1="8" x2="12.5" y2="8" stroke="currentColor" stroke-width="1.1"/></svg>
      乘车中
    </div>
    <div class="line-info">15号线 · 顺义方向</div>

    <div class="warning-banner">
      <div class="warning-title">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2L1.5 13.5h13L8 2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><line x1="8" y1="7" x2="8" y2="10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="11.8" r="0.6" fill="currentColor"/></svg>
        定位暂不可用
      </div>
      <div class="warning-desc">信号恢复后自动更新进度</div>
      <div class="warning-time">最后更新：2 分钟前</div>
    </div>

    <div class="timeline">
      <div class="t-item t-confirmed"><div class="t-dot"></div>望京西 ✓</div>
      <div class="t-item t-confirmed"><div class="t-dot"></div>望京 ✓</div>
      <div class="t-item t-confirmed"><div class="t-dot"></div>崔各庄<span class="t-confirmed-label">最后确认</span></div>
      <div class="t-item t-unknown"><div class="t-dot"></div>马泉营 ?</div>
      <div class="t-item t-unknown"><div class="t-dot"></div>孙河 ?</div>
    </div>

    <div class="divider"></div>

    <div class="frozen-text">进度已冻结，等待定位恢复</div>
    <div class="info-row">
      <span class="info-label">下车站</span>
      <span class="info-value">清华东路西口站</span>
    </div>
    <div class="info-row">
      <span class="info-label">预计到达</span>
      <span class="info-value" style="color:rgba(255,255,255,0.3)">暂不可用</span>
    </div>

    <div class="data-source">定位丢失 · 上次可信位置 2 分钟前</div>
  </div>
  <div class="card-footer">
    <button class="user-btn" onclick="window.location.href='16-设置.html'" title="设置与历史">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="footer-actions">
      <button class="pill-btn">已经下车</button>
    </div>
  </div>
</div>
</body>
</html>
