<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 步行前往目的地</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;background:#272729;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#FFF;box-shadow:0 25px 60px rgba(0,0,0,0.12),inset 0 0 0 0.5px rgba(255,255,255,0.06)}
.card-body{flex:1;padding:32px 28px 0;display:flex;flex-direction:column;justify-content:center}
.card-footer{padding:16px 28px 28px;display:flex;justify-content:space-between;align-items:flex-end}
.scene-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);letter-spacing:0.3px;margin-bottom:24px;display:flex;align-items:center;gap:8px}
.primary-value{font-size:34px;font-weight:700;letter-spacing:-0.8px;line-height:1.1;margin-bottom:10px}
.distance{font-size:20px;color:#2997FF;font-weight:600;margin-bottom:6px}
.dest-name{font-size:15px;color:rgba(255,255,255,0.45);margin-bottom:0}
.divider{height:1px;background:rgba(255,255,255,0.08);margin:28px 0}
.info-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}
.info-label{color:rgba(255,255,255,0.4);font-size:13px}
.info-value{color:rgba(255,255,255,0.8);font-weight:500;font-size:14px}
.data-source{font-size:11px;color:rgba(255,255,255,0.2);margin-top:28px}
.user-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.user-btn:hover{background:rgba(255,255,255,0.14)}
.correction{font-size:13px;color:rgba(255,255,255,0.25);cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<a href="index.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-body">
    <div class="scene-label">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><rect x="3" y="3" width="10" height="10.5" rx="1.5" stroke="currentColor" stroke-width="1.1"/><rect x="5.5" y="5.5" width="2" height="2" rx="0.3" fill="currentColor" opacity="0.4"/><rect x="8.5" y="5.5" width="2" height="2" rx="0.3" fill="currentColor" opacity="0.4"/><rect x="5.5" y="9" width="2" height="2" rx="0.3" fill="currentColor" opacity="0.4"/><rect x="8.5" y="9" width="2" height="2" rx="0.3" fill="currentColor" opacity="0.4"/></svg>
      步行前往目的地
    </div>
    <div class="primary-value">还需步行约 6 分钟</div>
    <div class="distance">约 450 米</div>
    <div class="dest-name">中关村软件园</div>

    <div class="divider"></div>

    <div class="info-row">
      <span class="info-label">预计到达</span>
      <span class="info-value" style="color:#2997FF">8:05</span>
    </div>
    <div class="info-row">
      <span class="info-label">已用时</span>
      <span class="info-value">48 分钟</span>
    </div>

    <div class="data-source">距离基于当前位置 · 刚刚更新</div>
  </div>
  <div class="card-footer">
    <button class="user-btn" onclick="window.location.href='16-settings.html'" title="设置与历史">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <a class="correction" href="11-arrived.html">模拟到达目的地 →</a>
  </div>
</div>
</body>
</html>
