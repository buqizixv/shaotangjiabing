<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 选择方案</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;background:#272729;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#FFF;box-shadow:0 25px 60px rgba(0,0,0,0.12),inset 0 0 0 0.5px rgba(255,255,255,0.06)}
.card-body{flex:1;padding:32px 28px 0;display:flex;flex-direction:column;overflow-y:auto}
.card-body::-webkit-scrollbar{display:none}
.card-footer{padding:16px 28px 28px}
.step{font-size:12px;color:rgba(255,255,255,0.3);letter-spacing:0.5px;margin-bottom:8px}
.title{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
.route-summary{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:20px}
.plan{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.06);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color 0.2s}
.plan:hover{border-color:rgba(255,255,255,0.12)}
.plan.selected{border-color:rgba(41,151,255,0.5);background:rgba(41,151,255,0.06)}
.plan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.plan-badge{font-size:12px;color:rgba(255,255,255,0.4);font-weight:500}
.plan.selected .plan-badge{color:#2997FF}
.plan-time{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.plan.selected .plan-time{color:#2997FF}
.plan-check{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center}
.plan.selected .plan-check{border-color:#2997FF;background:#2997FF}
.plan-route{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.plan-seg{font-size:12px;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.06);padding:3px 8px;border-radius:6px}
.plan-arrow{color:rgba(255,255,255,0.2);font-size:11px}
.plan-stats{font-size:12px;color:rgba(255,255,255,0.3)}
.action-btn{display:block;width:100%;background:#2997FF;color:#fff;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
</style>
</head>
<body>
<a href="原型导航.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-body">
    <div class="step">第 2 步，共 3 步</div>
    <div class="title">选择方案</div>
    <div class="route-summary">望京西园四区 → 中关村软件园</div>

    <div class="plan selected">
      <div class="plan-header">
        <div><div class="plan-badge">方案一</div><div class="plan-time">约 48 分钟</div></div>
        <div class="plan-check"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 6l2.5 2.5L9.5 4" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="plan-route">
        <span class="plan-seg">步行 8分</span><span class="plan-arrow">→</span>
        <span class="plan-seg">15号线 25分</span><span class="plan-arrow">→</span>
        <span class="plan-seg">步行 6分</span>
      </div>
      <div class="plan-stats">换乘 0 次 · 步行 1.2 km</div>
    </div>

    <div class="plan">
      <div class="plan-header">
        <div><div class="plan-badge">方案二</div><div class="plan-time">约 52 分钟</div></div>
        <div class="plan-check"></div>
      </div>
      <div class="plan-route">
        <span class="plan-seg">步行 5分</span><span class="plan-arrow">→</span>
        <span class="plan-seg">15号线 18分</span><span class="plan-arrow">→</span>
        <span class="plan-seg">换乘</span><span class="plan-arrow">→</span>
        <span class="plan-seg">13号线 12分</span><span class="plan-arrow">→</span>
        <span class="plan-seg">步行 8分</span>
      </div>
      <div class="plan-stats">换乘 1 次 · 步行 1.0 km</div>
    </div>

    <div class="plan">
      <div class="plan-header">
        <div><div class="plan-badge">方案三</div><div class="plan-time">约 61 分钟</div></div>
        <div class="plan-check"></div>
      </div>
      <div class="plan-route">
        <span class="plan-seg">步行 3分</span><span class="plan-arrow">→</span>
        <span class="plan-seg">477路 35分</span><span class="plan-arrow">→</span>
        <span class="plan-seg">步行 10分</span>
      </div>
      <div class="plan-stats">换乘 0 次 · 步行 1.0 km</div>
    </div>
  </div>
  <div class="card-footer">
    <button class="action-btn" onclick="window.location.href='04-权限.html'">保存方案</button>
  </div>
</div>
</body>
</html>
