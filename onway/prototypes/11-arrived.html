<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 已到达</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,0.12)}
.card-top{background:linear-gradient(160deg,#0055B3,#2997FF);padding:48px 28px 36px;text-align:center;color:#fff}
.check-icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.arrived-text{font-size:30px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
.arrived-dest{font-size:15px;opacity:0.8}
.card-bottom{flex:1;background:#FFFFFF;padding:28px;display:flex;flex-direction:column}
.stats{display:flex;gap:8px;margin-bottom:20px}
.stat{flex:1;text-align:center}
.stat-label{font-size:12px;color:#86868B;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:700;color:#1D1D1F}
.stat-value.subtle{font-size:16px;font-weight:400;color:#86868B}
.stat-value.warn{color:#FF9F0A;font-size:16px}
.divider{height:1px;background:#E5E5EA;margin:16px 0}
.insight{text-align:center;font-size:14px;color:#86868B;margin-bottom:24px}
.link-btn{display:block;text-align:center;font-size:16px;font-weight:600;color:#0066CC;text-decoration:none;padding:10px;margin-bottom:8px}
.close-btn{display:block;text-align:center;font-size:15px;color:#86868B;text-decoration:none;padding:8px;cursor:pointer}
.card-foot{padding:12px 28px 24px;background:#fff;display:flex;justify-content:space-between;align-items:flex-end;border-bottom-left-radius:28px;border-bottom-right-radius:28px}
.user-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.05);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.user-btn:hover{background:rgba(0,0,0,0.08)}
</style>
</head>
<body>
<a href="index.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-top">
    <div class="check-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M7 14.5l5.5 5.5L21.5 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="arrived-text">已到达</div>
    <div class="arrived-dest">中关村软件园</div>
  </div>
  <div class="card-bottom">
    <div class="stats">
      <div class="stat">
        <div class="stat-label">本次耗时</div>
        <div class="stat-value">47 分钟</div>
      </div>
      <div class="stat">
        <div class="stat-label">平时</div>
        <div class="stat-value subtle">约 35 分</div>
      </div>
      <div class="stat">
        <div class="stat-label">差异</div>
        <div class="stat-value warn">+12 分</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="insight">今天比平常多了 12 分钟</div>
    <a href="17-history.html" class="link-btn">查看历史详情 →</a>
    <a class="close-btn" href="12-idle.html">关闭</a>
  </div>
  <div class="card-foot">
    <button class="user-btn" onclick="window.location.href='16-settings.html'" title="设置与历史">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="rgba(0,0,0,0.3)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <span style="font-size:11px;color:#86868B">07:12 出发 → 07:59 到达</span>
  </div>
</div>
</body>
</html>
