<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 换乘</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;background:#272729;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#FFF;box-shadow:0 25px 60px rgba(0,0,0,0.12),inset 0 0 0 0.5px rgba(255,255,255,0.06)}
.card-body{flex:1;padding:32px 28px 0;display:flex;flex-direction:column;overflow-y:auto}
.card-body::-webkit-scrollbar{display:none}
.card-footer{padding:16px 28px 28px;display:flex;justify-content:space-between;align-items:flex-end}
.scene-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);letter-spacing:0.3px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.primary-value{font-size:28px;font-weight:700;letter-spacing:-0.5px;line-height:1.15;margin-bottom:4px}
.accent{color:#2997FF}
.direction{font-size:15px;color:#2997FF;font-weight:500;margin-bottom:18px}
.transfer-panel{background:rgba(255,255,255,0.04);border-radius:16px;padding:16px;margin-bottom:10px}
.transfer-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.transfer-label{font-size:13px;color:rgba(255,255,255,0.4)}
.transfer-value{font-size:15px;font-weight:600;color:#2997FF}
.transfer-sub{font-size:12px;color:rgba(255,255,255,0.3)}
.divider{height:1px;background:rgba(255,255,255,0.08);margin:14px 0}
.info-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0}
.info-label{color:rgba(255,255,255,0.4);font-size:13px}
.info-value{color:rgba(255,255,255,0.8);font-weight:500;font-size:14px}
.data-source{font-size:11px;color:rgba(255,255,255,0.2);margin-top:auto;padding-top:12px}
.user-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.user-btn:hover{background:rgba(255,255,255,0.14)}
.pill-btn{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);border:none;border-radius:14px;padding:9px 18px;font-size:13px;cursor:pointer;font-family:inherit}
.pill-btn:hover{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7)}
</style>
</head>
<body>
<a href="index.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-body">
    <div class="scene-label">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 5.5h9m-2-2.5l2.5 2.5-2.5 2.5M13.5 10.5h-9m2 2.5L4 10.5l2.5-2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      换乘中
    </div>
    <div class="primary-value">换乘至 13号线</div>
    <div class="direction">西直门方向</div>

    <div class="transfer-panel">
      <div class="transfer-row">
        <span class="transfer-label">步行至13号线站台</span>
        <span class="transfer-value">约 4 分钟</span>
      </div>
      <div class="transfer-sub">沿指示牌前往13号线换乘通道</div>
    </div>

    <div class="transfer-panel">
      <div class="transfer-row">
        <span class="transfer-label">13号线 下一班</span>
        <span class="transfer-value">约 5 分钟</span>
      </div>
      <div class="transfer-sub">上车站：西二旗站</div>
    </div>

    <div class="divider"></div>

    <div class="info-row">
      <span class="info-label">下车站</span>
      <span class="info-value">上地站 · 2 站</span>
    </div>
    <div class="info-row">
      <span class="info-label">预计到达目的地</span>
      <span class="info-value" style="color:#2997FF">8:02</span>
    </div>
    <div class="info-row">
      <span class="info-label">全程剩余</span>
      <span class="info-value">约 15 分钟</span>
    </div>

    <div class="data-source">换乘数据 · 规划估算</div>
  </div>
  <div class="card-footer">
    <button class="user-btn" onclick="window.location.href='16-settings.html'" title="设置与历史">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button class="pill-btn" onclick="window.location.href='10-last-walk.html'">已经上车</button>
  </div>
</div>
</body>
</html>
