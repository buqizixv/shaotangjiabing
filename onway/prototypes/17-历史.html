<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途 · 历史</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;gap:16px;padding:20px}
.nav-link{font-size:13px;color:#86868B;text-decoration:none;display:flex;align-items:center;gap:4px}.nav-link:hover{color:#0066CC}
.card{width:360px;height:509px;background:#272729;border-radius:28px;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#FFF;box-shadow:0 25px 60px rgba(0,0,0,0.12),inset 0 0 0 0.5px rgba(255,255,255,0.06)}
.card-body{flex:1;padding:28px 24px 0;display:flex;flex-direction:column;overflow-y:auto}
.card-body::-webkit-scrollbar{display:none}
.card-footer{padding:12px 24px 24px;display:flex;justify-content:space-between;align-items:flex-end}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.title{font-size:24px;font-weight:700;letter-spacing:-0.3px}
.close-btn{color:rgba(255,255,255,0.4);cursor:pointer;padding:4px}
.summary{display:flex;gap:0;margin-bottom:18px}
.summary-item{flex:1;text-align:center;padding:12px 0}
.summary-label{font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:4px}
.summary-value{font-size:18px;font-weight:700}
.summary-unit{font-size:12px;font-weight:400;color:rgba(255,255,255,0.5)}
.chart{background:rgba(255,255,255,0.03);border-radius:14px;padding:16px;margin-bottom:16px}
.chart-title{font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:14px;font-weight:500}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:100px;gap:6px;position:relative}
.avg-line{position:absolute;bottom:50px;left:0;right:0;border-bottom:1px dashed rgba(255,255,255,0.1);z-index:0}
.avg-label{position:absolute;right:0;bottom:52px;font-size:10px;color:rgba(255,255,255,0.2)}
.bar-group{display:flex;flex-direction:column;align-items:center;flex:1;z-index:1}
.bar{width:100%;border-radius:4px 4px 2px 2px;background:rgba(255,255,255,0.08);min-height:2px;position:relative}
.bar.active{background:#2997FF}
.bar.today{background:#0066CC}
.bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,0.4);white-space:nowrap}
.bar.today .bar-val,.bar.active .bar-val{color:#2997FF}
.bar-label{margin-top:6px;font-size:10px;color:rgba(255,255,255,0.25)}
.bar.today .bar-label{color:#2997FF;font-weight:600}
.section-title{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.history-list{margin-bottom:8px}
.history-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.history-item:last-child{border-bottom:none}
.h-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.h-date{font-size:13px;color:rgba(255,255,255,0.6);font-weight:500}
.h-duration{font-size:14px;font-weight:600}
.h-diff{font-size:12px;color:#FF9F0A;margin-left:6px}
.h-diff.good{color:#30D158}
.h-route{font-size:12px;color:rgba(255,255,255,0.3)}
.h-time{font-size:12px;color:rgba(255,255,255,0.2);margin-top:2px}
.user-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<a href="原型导航.html" class="nav-link"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>返回导航</a>
<div class="card">
  <div class="card-body">
    <div class="header">
      <div class="title">通勤历史</div>
      <div class="close-btn" onclick="window.location.href='16-设置.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="summary">
      <div class="summary-item">
        <div class="summary-label">平均耗时</div>
        <div class="summary-value">38 <span class="summary-unit">分</span></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">本周通勤</div>
        <div class="summary-value">8 <span class="summary-unit">次</span></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">准时率</div>
        <div class="summary-value">75<span class="summary-unit">%</span></div>
      </div>
    </div>

    <div class="chart">
      <div class="chart-title">近 7 次耗时</div>
      <div class="bars">
        <div class="avg-line"></div>
        <div class="avg-label">平均 35</div>
        <div class="bar-group"><div class="bar active" style="height:50px"><div class="bar-val">35</div></div><div class="bar-label">周一</div></div>
        <div class="bar-group"><div class="bar active" style="height:54px"><div class="bar-val">38</div></div><div class="bar-label">周二</div></div>
        <div class="bar-group"><div class="bar active" style="height:60px"><div class="bar-val">42</div></div><div class="bar-label">周三</div></div>
        <div class="bar-group"><div class="bar active" style="height:51px"><div class="bar-val">36</div></div><div class="bar-label">周四</div></div>
        <div class="bar-group"><div class="bar today" style="height:67px"><div class="bar-val">47</div></div><div class="bar-label">周五</div></div>
        <div class="bar-group"><div class="bar" style="height:2px"><div class="bar-val">—</div></div><div class="bar-label">周六</div></div>
        <div class="bar-group"><div class="bar" style="height:2px"><div class="bar-val">—</div></div><div class="bar-label">周日</div></div>
      </div>
    </div>

    <div class="section-title">详细记录</div>
    <div class="history-list">
      <div class="history-item">
        <div class="h-top">
          <span class="h-date">10/02 周五 · 去程</span>
          <span class="h-duration">47 分钟 <span class="h-diff">+12</span></span>
        </div>
        <div class="h-route">方案一 · 15号线直达</div>
        <div class="h-time">07:12 出发 → 07:59 到达</div>
      </div>
      <div class="history-item">
        <div class="h-top">
          <span class="h-date">10/01 周四 · 去程</span>
          <span class="h-duration">36 分钟 <span class="h-diff good">+1</span></span>
        </div>
        <div class="h-route">方案一 · 15号线直达</div>
        <div class="h-time">07:20 出发 → 07:56 到达</div>
      </div>
      <div class="history-item">
        <div class="h-top">
          <span class="h-date">09/30 周三 · 去程</span>
          <span class="h-duration">42 分钟 <span class="h-diff">+7</span></span>
        </div>
        <div class="h-route">方案一 · 15号线直达</div>
        <div class="h-time">07:08 出发 → 07:50 到达</div>
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button class="user-btn" onclick="window.location.href='16-设置.html'" title="设置与历史">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/><path d="M3.5 18c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
    </button>
    <span style="font-size:11px;color:rgba(255,255,255,0.15)">基于 8 次有效记录</span>
  </div>
</div>
</body>
</html>
