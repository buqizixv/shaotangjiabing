# weather-agent — a light bottom-tab mini app: weather, a chat console and a
# day schedule. As an OctoSense app it publishes the forecast and the schedule
# as bounded read tools on the AI bus, so the shell's assistant can answer about
# them (src/ai.rs); the console uses OctoSense's injected system assistant.
#
# Two homes: the standalone window (development preview and the AI tool port),
# and the linked MODULE that claims the host's system assistant (src/module.rs).

[package]
name = "octosense-weather-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
default-run = "octosense-weather-agent"

[[bin]]
name = "octosense-weather-agent"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
name = "octosense_weather_agent"
path = "src/lib.rs"

[features]
default = ["standalone"]
# The standalone window: the F10 overlay and the port toward it. A host that
# links the MODULE leaves this off and gets the lib only.
standalone = ["dep:makepad-aichat", "dep:makepad-wm-api"]

[dependencies]
makepad-widgets = { workspace = true }
# The AI bus: the forecast's read tools toward the assistant.
makepad-ai-services = { workspace = true }
# The shell's scoped system assistant service.
octosense-app-peers = { workspace = true, features = ["octos-core"] }
serde_json = { workspace = true }
# The module contract: what a host seats in-process (src/module.rs).
makepad-app-module = { workspace = true }
makepad-wm-theme = { workspace = true }
makepad-aichat = { workspace = true, optional = true }
makepad-wm-api = { workspace = true, optional = true }
# Standalone-only fallback: 起内核 + 拿 broker 给 standalone 窗格或 shell 注入
# 失败时的兜底用。`octos-core` feature 让 `octosense-app-peers::hosted` 模块
# 暴露出来，否则 broker 那一套编不进去。
octosense-kernel = { workspace = true }
octosense-llm-config = { workspace = true }
